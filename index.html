<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9d9f7">
<meta name="color-scheme" content="light">
<title>Bưu thiếp và tháp thư</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&family=Lora:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
  :root{
    /* ===== BẢNG MÀU XANH DƯƠNG: đổi ở đây là đổi cả trang ===== */
    --nen:#cfe5fb;
    --muc:#10294a;       /* chữ */
    --phu:#4a6485;       /* chữ phụ */
    --nhan:#2a78d4;      /* xanh nhấn (nút, tem) */
    --nhan-dam:#1b5fb0;
    --giay:#f2f8ff;      /* giấy thư */
    --vung-an-toan-tren:env(safe-area-inset-top,0px);
    --vung-an-toan-duoi:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;color:var(--muc);overscroll-behavior:none;
    font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--nen)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--nhan);outline-offset:3px}

  /* ============ SÂN KHẤU ============ */
  .san{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    padding:var(--vung-an-toan-tren) 0 var(--vung-an-toan-duoi);
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.75),transparent 40%),
      radial-gradient(circle at 85% 80%,rgba(120,180,240,.55),transparent 45%),
      linear-gradient(160deg,#e3f2ff,#bcdaf7 55%,#9fc9f1);
    --W:min(88vw,640px,calc((100vh - 210px)/.6667));
  }
  @supports (height:100dvh){ .san{--W:min(88vw,640px,calc((100dvh - 210px)/.6667))} }

  /* ============ HOA VÀ TIM RƠI (nền) ============ */
  .hat-lop{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .hat{position:absolute;top:0;left:0;background-size:contain;background-repeat:no-repeat;
    will-change:transform;animation:roi linear infinite}
  @keyframes roi{
    from{transform:translate3d(0,-14vh,0) rotate(0deg)}
    to{transform:translate3d(var(--dx),114vh,0) rotate(var(--rot))}
  }
  .san.an-hat .hat{animation-play-state:paused}

  /* ============ BƯU THIẾP 4x6 INCH ============ */
  .nho{position:relative;z-index:2;transition:opacity .6s}
  .san:not(.o-banner):not(.o-thap) .nho{animation:troi 4.5s ease-in-out infinite}
  @keyframes troi{50%{transform:translateY(-8px)}}
  .nghieng{transition:transform .25s ease-out;will-change:transform}

  .the{
    position:relative;cursor:pointer;overflow:hidden;
    width:var(--W);height:calc(var(--W)*.6667);        /* 6 x 4 inch */
    background:#fff;padding:3.2%;border-radius:6px;
    box-shadow:0 20px 44px rgba(16,41,74,.3),0 2px 0 rgba(0,0,0,.05);
    transform:rotate(-3deg);
    transition:transform .9s cubic-bezier(.77,0,.18,1);
  }
  /* vệt sáng quét qua bưu thiếp */
  .the::before{content:"";position:absolute;z-index:5;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);animation:quet 5s ease-in-out infinite 1.2s}
  @keyframes quet{0%,55%{left:-60%}85%,100%{left:130%}}
  .san.o-banner .nho .the::before,.san.o-thap .nho .the::before{animation:none;opacity:0}

  .anh{position:relative;width:100%;height:100%;border-radius:2px;background-size:cover;background-position:center;
    display:flex;align-items:flex-end}
  .anh::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(10,30,60,.62),rgba(10,30,60,0) 50%)}
  .loi{position:relative;z-index:1;padding:4% 5%;color:#fff;
    font-family:"Dancing Script",cursive;font-weight:700;
    font-size:calc(var(--W)*.075);line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
  .loi small{display:block;font:500 max(11px,calc(var(--W)*.024))/1.4 "Be Vietnam Pro",sans-serif;margin-top:4px;opacity:.94}
  .tem{position:absolute;z-index:3;right:calc(var(--W)*.05);top:calc(var(--W)*.05);
    width:calc(var(--W)*.11);aspect-ratio:3/4;background:var(--nhan);color:#fff;padding:4px;
    display:grid;place-items:center;text-align:center;transform:rotate(4deg);pointer-events:none;
    font:700 max(7px,calc(var(--W)*.016))/1.2 Lora,serif;
    -webkit-mask:radial-gradient(circle 3.5px at 3.5px 3.5px,#0000 98%,#000) -3.5px -3.5px/7px 7px;
            mask:radial-gradient(circle 3.5px at 3.5px 3.5px,#0000 98%,#000) -3.5px -3.5px/7px 7px}
  .tem span{border:1.3px solid rgba(255,255,255,.7);width:100%;height:100%;display:grid;place-items:center}
  .chu-duoi{text-align:center;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:12px;
    position:relative;z-index:2;transition:opacity .4s}
  .chu-duoi h1{font-family:Lora,serif;font-size:clamp(1.35rem,3.4vw,2.2rem);line-height:1.2}
  .nut-mo{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;
    background:var(--nhan);color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(42,120,212,.4)}
  .nut-mo svg{animation:chi 1.6s ease-in-out infinite}
  @keyframes chi{50%{transform:translateX(6px)}}

  /* ============ THÁP THƯ ============ */
  .thap-khung{
    position:absolute;z-index:1;right:3vw;top:var(--vung-an-toan-tren);bottom:var(--vung-an-toan-duoi);width:min(470px,44vw);
    display:flex;flex-direction:column;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .4s,visibility 0s .4s;
  }
  .thap-dau{padding:22px 28px 6px}
  .thap-dau h2{font-family:"Dancing Script",cursive;font-size:2rem;line-height:1.1;color:var(--nhan-dam)}
  .thap-dau p{color:var(--phu);font-size:.9rem;margin-top:2px}
  .thap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 30px 70px;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .thap::-webkit-scrollbar{width:6px}
  .thap::-webkit-scrollbar-thumb{background:rgba(16,41,74,.3);border-radius:6px}

  .la{
    --r:0deg;--x:0px;
    position:relative;display:block;width:100%;height:128px;margin-top:-64px;
    padding:13px 78px 0 20px;text-align:left;border-radius:6px;background:var(--p,#f2f8ff);
    box-shadow:0 -3px 12px rgba(16,41,74,.16),0 1px 0 rgba(0,0,0,.06);
    transform:rotate(var(--r)) translateX(var(--x));
    transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;
  }
  .la:first-child{margin-top:0}
  .la b{display:block;font-family:Lora,serif;font-weight:700;font-size:1rem;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .la small{display:block;color:var(--phu);font-size:.8rem;margin-top:3px}
  .la::after{content:"";position:absolute;right:16px;top:12px;width:40px;height:52px;background:var(--tm,var(--c,#2a78d4));
    outline:2px dashed rgba(255,255,255,.8);outline-offset:-5px;border-radius:2px}
  .la:focus-visible{z-index:50!important;transform:rotate(0) translateY(-10px) scale(1.04);box-shadow:0 16px 30px rgba(16,41,74,.32)}
  @media (hover:hover){
    .la:hover{z-index:50!important;transform:rotate(0) translateX(0) translateY(-10px) scale(1.04);
      box-shadow:0 16px 30px rgba(16,41,74,.32)}
  }
  .la:active{transform:rotate(0) scale(.98)}

  @keyframes no{
    from{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.2)}
    60%{opacity:1}
    to{opacity:1;transform:rotate(var(--r)) translateX(var(--x))}
  }

  /* ---- Khi đã bấm vào bưu thiếp ---- */
  /* ---- Bấm vào bưu thiếp bìa: bìa bay đi, banner chủ đề hiện ra ---- */
  .san.o-banner .chu-duoi,.san.o-thap .chu-duoi{opacity:0;pointer-events:none}
  .san.o-banner .nho,.san.o-thap .nho{opacity:0;pointer-events:none}
  .san.o-banner .nho .the,.san.o-thap .nho .the{transform:translateY(-30vh) rotate(-8deg) scale(.4)}
  /* ---- Chọn một chủ đề: tháp thư của chủ đề đó nổ ra ---- */
  .san.o-thap .thap-khung{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s .25s,visibility 0s}

  /* ============ ĐỌC THƯ ============ */
  .doc-hop{position:fixed;inset:0;z-index:20;display:none;place-items:center;
    background:rgba(10,30,60,.74);padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .doc-hop.mo{display:grid}
  .doc-giay{position:relative;width:min(740px,100%);max-height:92vh;overflow:auto;background:var(--giay);
    border-radius:12px;padding:clamp(22px,5vw,56px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    animation:mothu .6s cubic-bezier(.2,1,.3,1)}
  @supports (height:100dvh){ .doc-giay{max-height:94dvh} }
  @keyframes mothu{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) rotate(-6deg) scale(.15)}}
  .doc-giay h3{font-family:Lora,serif;font-size:clamp(1.4rem,4.5vw,1.8rem);line-height:1.25;margin-bottom:6px;padding-right:48px}
  .doc-giay .sub{color:var(--nhan);font-size:.88rem;margin-bottom:20px}
  /* Ảnh kèm thư: ảnh in dán băng keo, rơi xuống rồi zoom chậm */
  .anh-thu{position:relative;margin:6px auto 26px;width:min(100%,520px);background:#fff;padding:10px 10px 0;
    border-radius:3px;box-shadow:0 10px 26px rgba(16,41,74,.28);transform:rotate(var(--g,-1.6deg));
    animation:tha 1s cubic-bezier(.2,1.2,.3,1) backwards}
  @keyframes tha{from{opacity:0;transform:translateY(-90px) rotate(calc(var(--g,-1.6deg)*-4)) scale(.85)}}
  .anh-thu::before,.anh-thu::after{content:"";position:absolute;top:-10px;width:72px;height:22px;
    background:rgba(150,200,245,.7);box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:3}
  .anh-thu::before{left:-20px;transform:rotate(-35deg)}
  .anh-thu::after{right:-20px;transform:rotate(35deg)}
  .khung-anh{position:relative;overflow:hidden;aspect-ratio:3/2;background:#cfe5fb}
  .zoom{position:absolute;inset:0;background-size:cover;background-position:center;
    animation:kb 16s ease-in-out infinite alternate}
  @keyframes kb{to{transform:scale(1.1) translate(-1.5%,-1%)}}
  .anh-thu figcaption{font:700 1.35rem/1.2 "Dancing Script",cursive;color:var(--nhan-dam);
    padding:10px 4px 12px;text-align:center}
  /* Chữ trong thư: gõ từng chữ khi cuộn tới */
  .hang-nut{text-align:right;margin-bottom:10px;min-height:30px}
  .nut-hien{font-size:.8rem;padding:.4em .95em;border-radius:999px;border:1.3px solid var(--phu);color:var(--phu)}
  .nut-hien:hover{background:var(--muc);color:#fff;border-color:var(--muc)}
  .doc-giay p{font-family:Lora,serif;font-size:clamp(1rem,2.8vw,1.07rem);line-height:1.9;margin-bottom:16px;
    max-width:64ch;white-space:pre-line}
  .tu{opacity:0;filter:blur(3px);transition:opacity .45s ease,filter .45s ease}
  .tu.hien{opacity:1;filter:none}
  .dang-go::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--nhan);
    vertical-align:-.2em;margin-left:2px;animation:nhay .7s steps(1) infinite}
  @keyframes nhay{50%{opacity:0}}
  #docNoidung p:first-child::first-letter{font-family:"Dancing Script",cursive;font-weight:700;font-size:3.3em;
    float:left;line-height:.82;margin:.06em .1em 0 0;color:var(--nhan)}
  /* Chữ ký cuối thư: nhiều font dự phòng đều có dấu tiếng Việt, dòng cao để không bị cắt dấu */
  .ky{--font-ky:"Dancing Script";--co-ky:1.8rem;
    font-family:var(--font-ky),"Dancing Script","Pacifico","Be Vietnam Pro",system-ui,sans-serif;
    font-weight:700;font-size:var(--co-ky);line-height:1.6;padding:.15em .1em .25em;margin-top:10px;
    color:var(--nhan-dam);text-align:right;white-space:pre-line;overflow-wrap:anywhere;
    font-synthesis:none;font-variant-ligatures:none;
    opacity:0;transform:rotate(-3deg);transform-origin:right center;
    clip-path:inset(-20% 100% -40% -5%);
    transition:opacity .4s,clip-path 1.8s cubic-bezier(.5,0,.2,1)}
  .ky.hien{opacity:1;clip-path:inset(-20% -5% -40% -5%)}
  .doc-dong{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;
    border:1.5px solid var(--muc);display:grid;place-items:center;background:var(--giay)}
  .doc-dong:hover{background:var(--muc);color:#fff}

  /* ============ BANNER CHỦ ĐỀ ============ */
  .banner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    padding-top:var(--vung-an-toan-tren);padding-bottom:var(--vung-an-toan-duoi);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s,visibility 0s .45s}
  .san.o-banner .banner{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s .2s,visibility 0s}
  .banner-dai{position:relative;flex:none;margin:14px auto 0;width:min(92vw,880px);padding:12px 56px 15px;
    text-align:center;color:#fff;
    background:linear-gradient(90deg,#1b5fb0,#2a78d4 50%,#1b5fb0);
    clip-path:polygon(0 0,100% 0,calc(100% - 24px) 50%,100% 100%,0 100%,24px 50%)}
  .banner-dai h2{font:700 clamp(1.6rem,4.5vw,2.4rem)/1.15 "Dancing Script",cursive}
  .banner-dai p{font-size:.9rem;opacity:.92;margin-top:2px}
  .san.o-banner .banner-dai{animation:rua .8s cubic-bezier(.2,1,.3,1) .1s backwards}
  @keyframes rua{from{opacity:0;transform:translateY(-50px) scaleX(.5)}}
  .banner-luoi{flex:1;min-height:0;overflow-y:auto;display:flex;padding:26px 20px 90px;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .luoi-trong{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin:auto;max-width:1100px}

  /* Mỗi chủ đề là một bưu thiếp 4x6 inch thu nhỏ */
  .loai-the{--W:clamp(210px,26vw,310px);--r:var(--ng,0deg);--x:0px;flex:0 0 auto;display:block;text-align:left;
    transform:rotate(var(--ng,0deg));
    transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}
  .loai-the .loi{font-size:max(15px,calc(var(--W)*.085))}
  @media (hover:hover){ .loai-the:hover{transform:rotate(0) translateY(-10px) scale(1.04);box-shadow:0 24px 44px rgba(16,41,74,.34)} }
  .loai-the:active{transform:scale(.97)}

  .quay{min-height:42px;padding:.5em 1.2em;border-radius:999px;border:1.5px solid var(--muc);
    background:rgba(255,255,255,.72);font-size:.9rem;transition:background .2s,color .2s}
  .quay:hover{background:var(--muc);color:#fff}
  .banner .quay{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--vung-an-toan-duoi))}
  .thap-dau .quay{min-height:36px;font-size:.82rem;margin-bottom:8px}

  /* Bưu thiếp của chủ đề đang chọn (nằm bên trái, bấm vào để chọn chủ đề khác) */
  .nho-loai{position:absolute;left:50%;top:50%;z-index:2;opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.5) rotate(-8deg);
    transition:transform .9s cubic-bezier(.77,0,.18,1),opacity .5s}
  .san.o-thap .nho-loai{opacity:1;pointer-events:auto;transform:translate(calc(-50% - 22vw),-50%) rotate(-4deg) scale(.78);
    transition:transform .9s cubic-bezier(.77,0,.18,1) .15s,opacity .5s .15s}

  @media (max-width:640px){
    .loai-the{--W:calc((100vw - 52px)/2)}
    .luoi-trong{gap:18px}
    .mt{display:none}
  }

  /* ============ HIỆU ỨNG BẤT NGỜ KHI MỞ THƯ ============ */
  .hu-lop{position:fixed;inset:0;z-index:30;overflow:hidden;pointer-events:none}
  .hu-lop i{will-change:transform}
  .lap{position:absolute;color:#fff;line-height:1;
    text-shadow:0 0 6px #fff,0 0 14px #7cc0f5,0 0 24px #2a78d4;
    animation:lap var(--d,1.6s) ease-in-out var(--dl,0s) 3 both}
  @keyframes lap{0%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(0) rotate(180deg)}}

  /* ============ ĐIỆN THOẠI DỌC / MÀN HÌNH HẸP ============ */
  @media (max-width:860px) and (orientation:portrait){
    .san.o-thap .nho-loai{transform:translate(-50%,-50%) translateY(-32vh) rotate(-3deg) scale(.5)}
    .thap-khung{left:0;right:0;top:calc(30vh + var(--vung-an-toan-tren));width:auto}
    .thap-dau{padding:6px 24px 0}
    .thap-dau h2{font-size:1.7rem}
    .thap{padding:10px 22px 70px}
    .la{height:120px;margin-top:-58px}
  }
  @media (max-width:520px){
    .san{gap:20px}
    .doc-hop{padding:0;align-items:end}
    .doc-giay{width:100%;max-height:94vh;border-radius:16px 16px 0 0}
  }
  /* ============ ĐIỆN THOẠI NẰM NGANG (màn hình thấp) ============ */
  @media (max-height:520px){
    .san{--W:min(56vw,calc((100vh - 70px)/.6667));gap:10px}
    .chu-duoi h1{display:none}
    .nut-mo{padding:9px 18px;font-size:.9rem}
    .thap-dau{padding:10px 24px 2px}
    .thap-dau h2{font-size:1.5rem}
    .san.o-thap .nho-loai{transform:translate(calc(-50% - 24vw),-50%) rotate(-4deg) scale(.8)}
    .banner-dai{padding:6px 56px 9px}
    .banner-dai p{display:none}
    .banner-luoi{padding-top:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .hat-lop{display:none}
  }
</style>
</head>
<body>

<div class="san" id="san">

  <!-- Hoa và tim rơi (được tạo bằng JS) -->
  <div class="hat-lop" id="hatLop" aria-hidden="true"></div>

  <!-- ===== BƯU THIẾP 4x6 INCH: bấm vào để nổ ra tháp thư ===== -->
  <div class="nho">
    <div class="nghieng" id="nghieng">
      <div class="the" id="the" role="button" tabindex="0" aria-label="Bấm vào bưu thiếp để mở các bức thư">
        <!-- >>> ĐỔI ẢNH Ở ĐÂY: thay images/bia.jpg bằng ảnh của bạn <<< -->
        <div class="anh" id="anhBia" style="background-image:url('images/bia.jpg'),linear-gradient(135deg,#2a78d4,#7cc0f5)">
          <div class="loi"><span id="bcTieude">Gửi từ trang viết của tôi</span><small id="bcPhu">Chuyện đi, chuyện ăn, chuyện nghề</small></div>
        </div>
        <div class="tem"><span id="bcTem">THƯ<br>5000</span></div>
      </div>
    </div>
  </div>

  <div class="chu-duoi">
    <h1 id="bcH1">Những điều tôi đã viết</h1>
    <span class="nut-mo"><span id="bcNut">Chạm vào bưu thiếp để mở thư</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </div>

  <!-- ===== BANNER CHỦ ĐỀ: mỗi chủ đề là một bưu thiếp ===== -->
  <section class="banner" id="banner" aria-label="Chọn chủ đề">
    <div class="banner-dai"><h2 id="bnTde">Gửi đến bạn</h2><p id="bnPhu">Chọn một chủ đề để mở những bức thư</p></div>
    <div class="banner-luoi"><div class="luoi-trong" id="luoiTrong"></div></div>
    <button class="quay" id="veBia" type="button">← Về bìa</button>
  </section>

  <!-- Bưu thiếp của chủ đề đang chọn -->
  <div class="nho-loai" id="nhoLoai">

     ky       : (không bắt buộc) chữ ký riêng của thư này, bỏ trống thì dùng CHU_KY.macDinh bên dưới

/* =====================================================================
   CHỮ HIỆN TRÊN TRANG — SỬA Ở ĐÂY (gõ gì cũng được, có dấu tiếng Việt thoải mái)
   Muốn xuống dòng thì gõ \n
   ===================================================================== */
const CHU = {
  bia_tieude : "Gửi từ trang viết của tôi",          // chữ lớn viết tay trên ảnh bưu thiếp
  bia_phu    : "Chuyện đi, chuyện ăn, chuyện nghề",   // dòng nhỏ bên dưới
  bia_tem    : "THƯ\n5000",                           // chữ trên con tem
  bia_h1     : "Những điều tôi đã viết",              // tiêu đề dưới bưu thiếp
  bia_nut    : "Chạm vào bưu thiếp để mở thư",        // chữ trên nút xanh
  thap_tde   : "Chọn một bức thư",                    // dòng nhỏ phía trên tháp thư
  thap_dem   : "{n} bức thư",                         // {n} tự thành số lượng thư
  nut_hien   : "Hiện hết chữ",                        // nút hiện nhanh toàn bộ chữ trong thư
  banner_tde : "Gửi đến bạn",                         // chữ lớn trên dải banner
  banner_phu : "Chọn một chủ đề để mở những bức thư", // dòng nhỏ dưới tiêu đề banner
  banner_ve  : "← Về bìa",                            // nút quay về bưu thiếp bìa
  loai_dem   : "{n} bức thư",                         // số thư ghi trên bưu thiếp chủ đề

};


/* =====================================================================
   CHỮ KÝ CUỐI THƯ — SỬA Ở ĐÂY
   - macDinh : chữ ký dùng chung cho mọi thư (gõ gì cũng được: tiếng Việt có dấu,
               chữ in hoa, emoji, tên riêng...). Muốn xuống dòng thì gõ \n
   - kieuChu : kiểu chữ ký. Chọn một trong hai (đã nạp sẵn, đều đủ dấu tiếng Việt):
                 "Dancing Script"  (nét viết tay mảnh)
                 "Pacifico"        (nét viết tay đậm, tròn)
   - coChu   : cỡ chữ, đơn vị rem (1.8 là vừa, 2.4 là to)
   Muốn MỖI THƯ một chữ ký riêng: thêm  ky:"..."  vào thư đó ở mảng thu bên trên.
   ===================================================================== */
const CHU_KY = {
  macDinh: "Hẹn thư sau ♥",
  kieuChu: "Dancing Script",
  coChu: 1.8
};

/* =====================================================================
   HIỆU ỨNG BẤT NGỜ KHI MỞ THƯ — SỬA Ở ĐÂY
   - tiLe : xác suất một lá thư có hiệu ứng mỗi lần mở (0 = không bao giờ,
            0.7 = khoảng 10 lần mở thì có 7 lần, 1 = lần nào cũng có)
   - loai : các hiệu ứng được chọn ngẫu nhiên, bớt tên nào thì hiệu ứng đó không xuất hiện:
              "phao-hoa"  pháo hoa tim nổ nhiều chỗ
              "lap-lanh"  ánh sao lấp lánh
              "bong-bay"  bóng bay xanh bay lên
              "tim-hong"  trái tim màu hồng bay lên lơ lửng
              "phao-hoa-dem"  pháo hoa thật: pháo bay vút lên rồi nổ tung (có cả pháo hình trái tim)
   Muốn ÉP một thư luôn có hiệu ứng nhất định: thêm  hieuung:"bong-bay"  vào thư đó.
   Muốn một thư KHÔNG BAO GIỜ có hiệu ứng: thêm  hieuung:"khong"
   ===================================================================== */
const HIEU_UNG = {
  tiLe: 0.7,
  loai: ["phao-hoa","lap-lanh","bong-bay","tim-hong","phao-hoa-dem"]
};

/* ---------- Màu giấy và màu tem của từng lá thư (đều xanh dương) ---------- */
const giay = ['#f2f8ff','#e8f2fd','#eef3fb','#e6f4f7','#edf0fb','#f5f9fe'];
const tem  = ['#2a78d4','#1b5fb0','#3aa0e8','#5a6fd6','#1f8fa8','#4a90c8'];

/* ---------- Tiện ích ---------- */
const tc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doanVan = t => t.split('\n\n').map(p=>`<p>${tc(p)}</p>`).join('');
const ngauNhien = (a,b)=> a + Math.random()*(b-a);
const giamChuyenDong = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Đưa chữ trong CHU lên trang */
const datChu = (id,v)=>{ const e=document.getElementById(id); if(e) e.innerHTML = tc(v).replace(/\n/g,'<br>'); };
datChu('bcTieude',CHU.bia_tieude); datChu('bcPhu',CHU.bia_phu); datChu('bcTem',CHU.bia_tem);
datChu('bcH1',CHU.bia_h1); datChu('bcNut',CHU.bia_nut); datChu('hienHet',CHU.nut_hien);
datChu('bnTde',CHU.banner_tde); datChu('bnPhu',CHU.banner_phu); datChu('veBia',CHU.banner_ve); datChu('veBanner',CHU.thap_ve);
document.title = CHU.bia_h1;
const nhoGon = matchMedia('(max-width:700px)').matches;

/* =====================================================================
   HOA VÀ TIM (vẽ bằng SVG, không cần tải ảnh)
   Muốn dùng ảnh riêng: thêm đường dẫn vào mảng ANH_RIENG, ví dụ ["images/hoa.png"]
   (nên dùng ảnh nền trong suốt, nếu không sẽ thấy khung vuông)
   ===================================================================== */
const ANH_RIENG = [];
const svgUri = s => 'url("data:image/svg+xml,'+encodeURIComponent(s)+'")';
const tim = c => svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 30"><path d="M16 29C-6 14 5-3 16 8 27-3 38 14 16 29Z" fill="${c}"/></svg>`);
const hoa = svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><g fill="#fff" stroke="#b3d3f2" stroke-width="1">`+
  [0,72,144,216,288].map(a=>`<circle cx="20" cy="9" r="8" transform="rotate(${a} 20 20)"/>`).join('')+
  `</g><circle cx="20" cy="20" r="5.5" fill="#ffc83d"/></svg>`);
const kieuHat = [tim('#2a78d4'),tim('#5aa9ee'),tim('#1b5fb0'),hoa,hoa,...ANH_RIENG.map(p=>`url("${p}")`)];

/* Rơi ở nền */
const hatLop = document.getElementById('hatLop');
if(!giamChuyenDong){
  const soHat = nhoGon ? 14 : 26;                       // điện thoại ít hơn cho nhẹ máy
  for(let i=0;i<soHat;i++){
    const h = document.createElement('i'); h.className='hat';
    const size = ngauNhien(16,nhoGon?30:38);
    h.style.cssText = `left:${ngauNhien(0,97)}%;width:${size}px;height:${size}px;opacity:${ngauNhien(.5,.9)};`+
      `background-image:${kieuHat[i%kieuHat.length]};animation-duration:${ngauNhien(11,22)}s;animation-delay:${-ngauNhien(0,22)}s;`+
      `--dx:${ngauNhien(-90,90)}px;--rot:${ngauNhien(-300,300)}deg`;
    hatLop.appendChild(h);
  }
  /* Tab ẩn thì dừng hoạt ảnh cho đỡ tốn pin */
  document.addEventListener('visibilitychange', ()=>san.classList.toggle('an-hat', document.hidden));
}

/* Nổ hoa tim khi bấm vào bưu thiếp */
function bungHoaTim(x,y){
  if(giamChuyenDong) return;
  const n = nhoGon ? 16 : 26;
  for(let i=0;i<n;i++){
    const e = document.createElement('i');
    const size = ngauNhien(14,34);
    e.style.cssText = `position:fixed;z-index:30;pointer-events:none;left:${x}px;top:${y}px;width:${size}px;height:${size}px;`+
      `background:${kieuHat[i%kieuHat.length]} center/contain no-repeat`;
    document.body.appendChild(e);
    const goc = ngauNhien(0,Math.PI*2), xa = ngauNhien(90,Math.min(340,innerWidth*.45));
    const dx = Math.cos(goc)*xa, dy = Math.sin(goc)*xa - ngauNhien(0,60);
    e.animate([
      {transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${ngauNhien(-360,360)}deg)`,opacity:1,offset:.7},
      {transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy*1.1+50}px)) scale(.9) rotate(${ngauNhien(-420,420)}deg)`,opacity:0}
    ],{duration:ngauNhien(900,1500),easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish = ()=>e.remove();
  }
}

/* ---------- Đổi ảnh bưu thiếp bằng cách chọn file từ máy ---------- */
/* Ảnh của từng lá thư (có màu xanh dự phòng khi chưa có ảnh) */
const dai = [['#2a78d4','#7cc0f5'],['#1b5fb0','#5aa9ee'],['#3aa0e8','#a6d8ff'],
             ['#5a6fd6','#9db4f5'],['#1f8fa8','#7fd3e4'],['#4a90c8','#bfe0f7']];
const nenThu = (t,i)=> `linear-gradient(135deg,${dai[i%6][0]},${dai[i%6][1]})`;
const anhThuCss = (t,i)=> (t.anh ? `url('${String(t.anh).replace(/'/g,'%27')}') center/cover no-repeat,` : '') + nenThu(t,i);

/* ---------- Các phần tử chính ---------- */
const san = document.getElementById('san'), the = document.getElementById('the'), nghieng = document.getElementById('nghieng');
const luoiTrong = document.getElementById('luoiTrong'), thap = document.getElementById('thap');
const theLoai = document.getElementById('theLoai');
let cacLa = [], loaiDangMo = null;

/* Thư nào ghi sai/không ghi chủ đề thì tự xếp vào chủ đề đầu tiên */
const loaiCua = t => LOAI.some(l=>l.id===t.loai) ? t.loai : LOAI[0].id;
const demThu = id => thu.filter(t=>loaiCua(t)===id).length;

/* ---------- Banner: mỗi chủ đề là một bưu thiếp ---------- */
LOAI.forEach((l,k)=>{
  const n = demThu(l.id);
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'the loai-the';
  b.style.setProperty('--ng', ((k%3)-1)*2.2+'deg');
  b.innerHTML = `<div class="anh" style="background-image:${anhThuCss({anh:l.anh},k)}">
      <div class="loi">${tc(l.ten)}<small><span class="mt">${tc(l.mota||'')} · </span>${tc(CHU.loai_dem.replace('{n}',n))}</small></div></div>
    <div class="tem"><span>${n}<br>THƯ</span></div>`;
  b.addEventListener('click', ()=>moThapLoai(l.id,b));
  luoiTrong.appendChild(b);
});
const cacTheLoai = [...luoiTrong.children];

/* Các thẻ bay ra từ một vị trí (bưu thiếp bìa hoặc bưu thiếp chủ đề) rồi vào chỗ của mình */
function bayRa(els, rect){
  const px = rect.left+rect.width/2, py = rect.top+rect.height/2;
  els.forEach((el,i)=>{
    const r = el.getBoundingClientRect();
    el.style.setProperty('--fx', Math.max(-700,Math.min(700, px-(r.left+r.width/2)))+'px');
    el.style.setProperty('--fy', Math.max(-700,Math.min(700, py-(r.top+r.height/2)))+'px');
    el.style.setProperty('--fr', ((i%2?1:-1)*(20+(i*13)%40))+'deg');
    el.style.animation = 'none'; void el.offsetWidth;
    el.style.animation = `no .8s cubic-bezier(.2,1.15,.3,1) ${Math.min(i*70,1300)}ms backwards`;
  });
}

/* ---------- Tháp thư của một chủ đề ---------- */
function dungThap(id){
  thap.innerHTML = ''; cacLa = [];
  const ds = thu.map((t,i)=>({t,i})).filter(x=>loaiCua(x.t)===id);
  ds.forEach(({t,i},k)=>{
    const la = document.createElement('button');
    la.type = 'button'; la.className = 'la';
    la.style.setProperty('--p', giay[k%giay.length]);
    la.style.setProperty('--c', tem[k%tem.length]);
    la.style.setProperty('--tm', anhThuCss(t,i));       // con tem trên lá thư chính là ảnh thu nhỏ
    la.style.setProperty('--r', (((k*7)%5)-2)*1.1+'deg');
    la.style.setProperty('--x', (((k*5)%7)-3)*3+'px');
    la.style.zIndex = k+1;
    la.innerHTML = `<b>${tc(t.tieude)}</b><small>${tc(t.ngay)}</small>`;
    la.addEventListener('click', e=>docThu(i,e));
    thap.appendChild(la); cacLa.push(la);
  });
  const idx = Math.max(0, LOAI.findIndex(x=>x.id===id)), l = LOAI[idx];
  document.getElementById('tdThap').textContent = l.ten;
  document.getElementById('soThu').textContent = CHU.thap_tde+' · '+CHU.thap_dem.replace('{n}', ds.length);
  // bưu thiếp chủ đề nằm bên trái
  document.getElementById('anhLoai').style.backgroundImage = anhThuCss({anh:l.anh}, idx);
  document.getElementById('loaiTen').textContent = l.ten;
  document.getElementById('loaiPhu').textContent = (l.mota||'')+' · '+CHU.loai_dem.replace('{n}', ds.length);
  document.getElementById('loaiTem').innerHTML = `${ds.length}<br>THƯ`;
}

/* ---------- Chuyển cảnh: bìa -> banner -> tháp thư ---------- */
function moBanner(){
  const pc = the.getBoundingClientRect();
  bungHoaTim(pc.left+pc.width/2, pc.top+pc.height/2);
  nghieng.style.transform = '';
  san.classList.remove('o-thap'); san.classList.add('o-banner');
  bayRa(cacTheLoai, pc);
}
function moThapLoai(id, nguon){
  const rect = nguon.getBoundingClientRect();
  bungHoaTim(rect.left+rect.width/2, rect.top+rect.height/2);
  loaiDangMo = id; dungThap(id);
  san.classList.remove('o-banner'); san.classList.add('o-thap');
  thap.scrollTop = 0;
  bayRa(cacLa, rect);
}
function veBanner(){
  if(!san.classList.contains('o-thap')) return;
  san.classList.remove('o-thap'); san.classList.add('o-banner');
  bayRa(cacTheLoai, theLoai.getBoundingClientRect());
}
function veBia(){ san.classList.remove('o-banner','o-thap'); }

const batPhim = (el,fn)=> el.addEventListener('keydown', e=>{
  if(e.target===el && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); fn(); } });
the.addEventListener('click', moBanner);        batPhim(the, moBanner);
theLoai.addEventListener('click', veBanner);    batPhim(theLoai, veBanner);
document.getElementById('veBia').addEventListener('click', veBia);
document.getElementById('veBanner').addEventListener('click', veBanner);

/* ---------- Bưu thiếp nghiêng 3D theo con trỏ (chỉ trên laptop có chuột) ---------- */
if(!giamChuyenDong && matchMedia('(hover:hover) and (pointer:fine)').matches){
  let cho = false, lx = 0, ly = 0;
  san.addEventListener('pointermove', e=>{
    if(san.classList.contains('o-banner') || san.classList.contains('o-thap')) return;
    lx = e.clientX/innerWidth-.5; ly = e.clientY/innerHeight-.5;
    if(cho) return; cho = true;
    requestAnimationFrame(()=>{
      nghieng.style.transform = `perspective(1000px) rotateY(${lx*12}deg) rotateX(${-ly*10}deg)`;
      cho = false;
    });
  });
  san.addEventListener('pointerleave', ()=>{ nghieng.style.transform=''; });
}

/* ---------- Hiệu ứng bất ngờ (ngẫu nhiên) ---------- */
let hieuHen = [], hieuLop = null;
const hen = (fn,ms)=>{ hieuHen.push(setTimeout(fn,ms)); };
function huyHieuUng(){
  hieuHen.forEach(clearTimeout); hieuHen = [];
  if(hieuLop){ hieuLop.remove(); hieuLop = null; }
}
const bongSvg = c => svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70"><ellipse cx="20" cy="22" rx="16" ry="20" fill="${c}"/><path d="M20 42 16 49h8z" fill="${c}"/><path d="M20 49C14 56 26 60 20 68" stroke="#6b8bb0" fill="none" stroke-width="1.2"/><ellipse cx="13" cy="14" rx="4" ry="7" fill="#fff" opacity=".4" transform="rotate(20 13 14)"/></svg>`);
const timHongSvg = c => svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 30"><path d="M16 29C-6 14 5-3 16 8 27-3 38 14 16 29Z" fill="${c}"/><ellipse cx="9.5" cy="9" rx="3" ry="2" fill="#fff" opacity=".5" transform="rotate(-35 9.5 9)"/></svg>`);
const HU = {
  'phao-hoa'(){
    for(let k=0;k<5;k++)
      hen(()=>bungHoaTim(ngauNhien(innerWidth*.15,innerWidth*.85), ngauNhien(innerHeight*.15,innerHeight*.55)), k*420);
  },
  'lap-lanh'(l){
    const n = nhoGon ? 22 : 36;
    for(let i=0;i<n;i++){
      const e = document.createElement('span'); e.className = 'lap';
      e.textContent = i%3 ? '✦' : '✧';
      e.style.cssText = `left:${ngauNhien(3,95)}%;top:${ngauNhien(5,92)}%;font-size:${ngauNhien(14,34)}px;--d:${ngauNhien(1.2,2.4)}s;--dl:${ngauNhien(0,2)}s`;
      l.appendChild(e);
    }
  },
  'bong-bay'(l){
    const mau = ['#2a78d4','#5aa9ee','#1b5fb0','#a6d8ff','#ffffff','#7cc0f5'];
    const n = nhoGon ? 8 : 12;
    for(let i=0;i<n;i++){
      const e = document.createElement('i'), w = ngauNhien(38,64), sway = ngauNhien(20,60)*(i%2?1:-1);
      e.style.cssText = `position:absolute;bottom:0;left:${ngauNhien(2,92)}%;width:${w}px;height:${w*1.75}px;background:${bongSvg(mau[i%mau.length])} center/contain no-repeat`;
      l.appendChild(e);
      e.animate([
        {transform:'translate(0,100%)'},
        {transform:`translate(${sway}px,-45vh)`},
        {transform:`translate(${-sway}px,-85vh)`},
        {transform:`translate(0,-${innerHeight*1.05+w*1.75}px)`}
      ],{duration:ngauNhien(5200,8200),delay:ngauNhien(0,1800),easing:'ease-in-out',fill:'both'});
    }
  },
  'tim-hong'(l){
    const hong = ['#ff6fa5','#ff8fb8','#ff4f8b','#ffb3d1','#f94d94','#ff9ec4'];
    const n = nhoGon ? 20 : 34;
    for(let i=0;i<n;i++){
      const e = document.createElement('i');
      const to = i%6===0 ? ngauNhien(70,110) : ngauNhien(24,60);      // thỉnh thoảng có một trái tim thật to
      const lech = ngauNhien(30,90)*(i%2?1:-1);
      e.style.cssText = `position:absolute;bottom:-${to+20}px;left:${ngauNhien(2,94)}%;width:${to}px;height:${to}px;`+
        `background:${timHongSvg(hong[i%hong.length])} center/contain no-repeat;filter:drop-shadow(0 4px 6px rgba(249,77,148,.35))`;
      l.appendChild(e);
      e.animate([
        {transform:'translate(0,0) scale(.3) rotate(-8deg)',opacity:0},
        {transform:`translate(${lech*.3}px,-18vh) scale(1) rotate(8deg)`,opacity:1,offset:.15},
        {transform:`translate(${-lech}px,-55vh) scale(1.08) rotate(-10deg)`,opacity:1,offset:.55},
        {transform:`translate(${lech*.6}px,-${innerHeight+to+40}px) scale(.9) rotate(10deg)`,opacity:.85}
      ],{duration:ngauNhien(4200,8000),delay:ngauNhien(0,2600),easing:'ease-in-out',fill:'both'});
    }
  },
  /* Pháo hoa thật vẽ bằng canvas: pháo bay lên, nổ thành chùm tia, cứ ba quả có một quả hình trái tim */
  'phao-hoa-dem'(l){
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
    l.appendChild(cv);
    const dpr = Math.min((typeof devicePixelRatio!=='undefined' ? devicePixelRatio : 1) || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    const g = cv.getContext('2d'); if(!g) return;
    g.scale(dpr,dpr);
    const mau = [[255,214,102],[255,255,255],[124,192,245],[90,169,238],[255,111,165],[190,220,255]];
    const pao = [], hat = [];
    const soQua = nhoGon ? 5 : 8, ti = Math.max(.7,Math.min(1.3,Math.min(W,H)/700));
    let daBan = 0, banTiep = 0.15;
    const t0 = performance.now(); let truoc = t0;

    function ban(){
      pao.push({x:ngauNhien(W*.15,W*.85), y:H+10, vx:ngauNhien(-25,25), v:ngauNhien(.78,1)*H*.95,
        ty:ngauNhien(H*.14,H*.45), c:mau[Math.floor(Math.random()*mau.length)], tim:daBan%3===2, vet:[]});
      daBan++;
    }
    function no(r){
      const n = nhoGon ? 46 : 78;
      for(let i=0;i<n;i++){
        let vx, vy, c = r.c, gr = 130;
        if(r.tim){                                           // chùm tia xếp thành hình trái tim
          const a = i/n*Math.PI*2;
          vx = 16*Math.pow(Math.sin(a),3)*11*ti;
          vy = -(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*11*ti;
          c = [255,111,165]; gr = 35;
        } else {
          const a = Math.random()*Math.PI*2, sp = Math.sqrt(Math.random())*ngauNhien(120,280)*ti;
          vx = Math.cos(a)*sp; vy = Math.sin(a)*sp;
          if(Math.random()<.35) c = mau[Math.floor(Math.random()*mau.length)];
        }
        hat.push({x:r.x,y:r.y,vx,vy,gr,c,s:ngauNhien(1.6,3.2),song:1,tan:ngauNhien(.5,.85)});
      }
    }
    function khung(now){
      if(!l.isConnected) return;                              // thư đã đóng thì dừng
      const dt = Math.max(0,Math.min(.05,(now-truoc)/1000)); truoc = now;
      const t = (now-t0)/1000;
      if(daBan<soQua && t>=banTiep){ ban(); banTiep = t+ngauNhien(.55,1.05); }

      g.globalCompositeOperation = 'destination-out';         // làm mờ dần để tạo vệt sáng đuôi
      g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0,0,W,H);
      g.globalCompositeOperation = 'lighter';

      for(let i=pao.length-1;i>=0;i--){
        const r = pao[i];
        r.y -= r.v*dt; r.x += r.vx*dt; r.vet.push([r.x,r.y]); if(r.vet.length>7) r.vet.shift();
        r.vet.forEach((p,j)=>{ g.fillStyle = `rgba(255,235,190,${(j+1)/r.vet.length*.8})`;
          g.beginPath(); g.arc(p[0],p[1],1.7,0,6.283); g.fill(); });
        if(r.y<=r.ty){ no(r); pao.splice(i,1); }
      }
      const can = Math.pow(.3,dt);
      for(let i=hat.length-1;i>=0;i--){
        const p = hat[i]; p.song -= p.tan*dt;
        if(p.song<=0){ hat.splice(i,1); continue; }
        p.vx *= can; p.vy = p.vy*can + p.gr*dt;
        p.x += p.vx*dt; p.y += p.vy*dt;
        const a = p.song*(.65+.35*Math.sin(t*30+i));          // nhấp nháy
        g.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a})`;
        g.beginPath(); g.arc(p.x,p.y,p.s*(.6+.4*p.song),0,6.283); g.fill();
      }
      if(daBan<soQua || pao.length || hat.length) requestAnimationFrame(khung);
    }
    requestAnimationFrame(khung);
  }
};
function chonHieuUng(t){
  if(giamChuyenDong) return;
  let ten = t.hieuung;
  if(ten==='khong') return;
  if(!HU[ten]){                                          // không ép: bốc thăm ngẫu nhiên
    if(Math.random() >= HIEU_UNG.tiLe) return;
    const ds = HIEU_UNG.loai.filter(x=>HU[x]);
    if(!ds.length) return;
    ten = ds[Math.floor(Math.random()*ds.length)];
  }
  hen(()=>{
    const l = document.createElement('div'); l.className = 'hu-lop';
    document.body.appendChild(l); hieuLop = l;
    HU[ten](l);
    hen(()=>{ l.remove(); if(hieuLop===l) hieuLop=null; }, 10000);
  }, 450);                                               // đợi tờ thư mở ra rồi mới có bất ngờ
}

/* ---------- Chọn một lá thư để đọc ---------- */
const docHop = document.getElementById('docHop'), docGiay = document.getElementById('docGiay');
const docNd = document.getElementById('docNoidung'), nutHien = document.getElementById('hienHet');
let dangDoc = -1, tokenGo = 0, io = null, hienHetFn = null;

const boChu = p => p.split(/(\s+)/).map(w => (w==='' || /^\s+$/.test(w)) ? w : `<span class="tu">${tc(w)}</span>`).join('');

function huyGoChu(){ tokenGo++; if(io){ io.disconnect(); io=null; } hienHetFn = null; }

/* Mỗi đoạn tự "gõ" từng chữ khi cuộn tới; đoạn dài gõ nhanh hơn để không phải chờ lâu */
function khoiDongGoChu(){
  huyGoChu();
  const my = tokenGo;
  const ps = [...docNd.querySelectorAll('p')], ky = docNd.querySelector('.ky');
  const hienPara = p => { p.querySelectorAll('.tu').forEach(x=>x.classList.add('hien')); p.classList.remove('dang-go'); xong.add(p); };
  const xong = new Set(), thay = new Set();
  hienHetFn = ()=>{ tokenGo++; if(io){ io.disconnect(); io=null; } ps.forEach(hienPara); ky.classList.add('hien'); };
  if(giamChuyenDong){ hienHetFn(); return; }
  let dang = false;
  function chay(){
    if(dang || my!==tokenGo) return;
    const k = ps.findIndex(p=>!xong.has(p) && thay.has(p));
    if(k<0){ if(xong.size===ps.length) ky.classList.add('hien'); return; }
    for(let j=0;j<k;j++) if(!xong.has(ps[j])) hienPara(ps[j]);        // đoạn đã cuộn qua: hiện luôn
    const p = ps[k], w = [...p.querySelectorAll('.tu')];
    const moiChu = Math.min(34, 2600/Math.max(1,w.length));          // mỗi đoạn tối đa khoảng 2,6 giây
    dang = true; p.classList.add('dang-go');
    const t0 = performance.now(); let n = 0;
    (function buoc(now){
      if(my!==tokenGo) return;
      const den = Math.min(w.length, Math.floor((now-t0)/moiChu)+1);
      while(n<den) w[n++].classList.add('hien');
      if(n<w.length) requestAnimationFrame(buoc);
      else { p.classList.remove('dang-go'); xong.add(p); dang=false; chay(); }
    })(t0);
  }
  // chờ ảnh rơi xuống và tờ thư mở xong rồi mới bắt đầu gõ
  setTimeout(()=>{
    if(my!==tokenGo) return;
    io = new IntersectionObserver(es=>{
      es.forEach(en=>{ if(en.isIntersecting) thay.add(en.target); });
      chay();
    },{root:docGiay, rootMargin:'0px 0px -8% 0px'});
    ps.forEach(p=>io.observe(p));
  }, 900);
}
nutHien.addEventListener('click', ()=>{ if(hienHetFn) hienHetFn(); });

function docThu(i,e){
  const t = thu[i]; dangDoc = i;
  huyHieuUng();
  document.getElementById('docTieude').textContent = t.tieude;
  document.getElementById('docSub').textContent = t.ngay;

  // Ảnh kèm thư
  const docAnh = document.getElementById('docAnh');
  docAnh.innerHTML = `<figure class="anh-thu" style="--g:${i%2?1.6:-1.6}deg">
      <div class="khung-anh"><div class="zoom" style="background:${anhThuCss(t,i)}"></div></div>
      <figcaption>${tc(t.chuthich||t.tieude)}</figcaption></figure>`;
  // Chữ trong thư: tách từng chữ để gõ dần
  docNd.innerHTML = t.noidung.split('\n\n').map(p=>`<p>${boChu(p)}</p>`).join('') +
                    `<div class="ky" style="--font-ky:'${CHU_KY.kieuChu}';--co-ky:${CHU_KY.coChu}rem">${tc(t.ky||CHU_KY.macDinh)}</div>`;
  nutHien.style.visibility = giamChuyenDong ? 'hidden' : 'visible';

  const cx = e && e.clientX ? e.clientX : innerWidth/2, cy = e && e.clientY ? e.clientY : innerHeight/2;
  docGiay.style.setProperty('--dx', (cx-innerWidth/2)+'px');
  docGiay.style.setProperty('--dy', (cy-innerHeight/2)+'px');
  docGiay.style.animation='none'; void docGiay.offsetWidth; docGiay.style.animation='';
  docHop.classList.add('mo'); docHop.setAttribute('aria-hidden','false');
  docGiay.scrollTop = 0;
  bungHoaTim(cx,cy);
  khoiDongGoChu();
  chonHieuUng(t);
}
function dongDoc(){ huyGoChu(); huyHieuUng(); docHop.classList.remove('mo'); docHop.setAttribute('aria-hidden','true'); }
document.getElementById('docDong').onclick = dongDoc;
docHop.addEventListener('click', e=>{ if(e.target===docHop) dongDoc(); });
addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(docHop.classList.contains('mo')) dongDoc();
  else if(san.classList.contains('o-thap')) veBanner();
  else veBia();
});
</script>
